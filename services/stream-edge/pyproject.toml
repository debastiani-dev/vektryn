[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vektryn-stream-edge"
version = "0.1.0"
description = "FastAPI ingestion edge, ATS collectors, and Kafka enrichment/matching workers for Vektryn"
authors = ["Rafael Debastiani <rjdebastiani@hotmail.com>"]
packages = [{ include = "stream_edge", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
httpx = "^0.28"
beautifulsoup4 = "^4.13"
confluent-kafka = "^2.8"
redis = "^5.2"
psycopg = { extras = ["binary"], version = "^3.2" }
pgvector = "^0.5.0"
google-genai = "^1.5"
google-cloud-storage = "^2.19"
pydantic = "^2.10"
pydantic-settings = "^2.7"
vektryn-contracts = { path = "../../packages/contracts", develop = true }
prometheus-client = "^0.26.0"
opentelemetry-sdk = "^1.45.2"
opentelemetry-exporter-otlp-proto-http = "^1.45.2"
opentelemetry-instrumentation-fastapi = "^0.66b2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
ruff = "^0.9"
black = "^25.1"
mypy = "^1.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]