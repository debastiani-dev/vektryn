services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: vektryn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vektryn}
      POSTGRES_USER: ${POSTGRES_USER:-vektryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektryn_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vektryn} -d ${POSTGRES_DB:-vektryn}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vektryn-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: vektryn-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: vektryn-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.enriched --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.rescore --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.alerts --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.dlq --partitions 1 --replication-factor 1
        echo "Kafka topics provisioned:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    container_name: vektryn-control-plane
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vektryn}
      POSTGRES_USER: ${POSTGRES_USER:-vektryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektryn_dev_password}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAM_EDGE_URL: http://stream-edge:8001
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      STREAM_AUTH_SECRET: ${STREAM_AUTH_SECRET:-vektryn-dev-stream-secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\"" ]
      interval: 10s
      timeout: 5s
      retries: 10

  stream-edge:
    build:
      context: .
      dockerfile: services/stream-edge/Dockerfile
    container_name: vektryn-stream-edge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vektryn}
      POSTGRES_USER: ${POSTGRES_USER:-vektryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektryn_dev_password}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      STREAM_AUTH_SECRET: ${STREAM_AUTH_SECRET:-vektryn-dev-stream-secret}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  enrichment-worker:
    build:
      context: .
      dockerfile: services/stream-edge/Dockerfile
    container_name: vektryn-enrichment-worker
    restart: unless-stopped
    command: [ "python", "-m", "stream_edge.workers.enrichment" ]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vektryn}
      POSTGRES_USER: ${POSTGRES_USER:-vektryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektryn_dev_password}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      control-plane:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  matcher-worker:
    build:
      context: .
      dockerfile: services/stream-edge/Dockerfile
    container_name: vektryn-matcher-worker
    restart: unless-stopped
    command: [ "python", "-m", "stream_edge.workers.matcher" ]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vektryn}
      POSTGRES_USER: ${POSTGRES_USER:-vektryn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vektryn_dev_password}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      control-plane:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vektryn-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - control-plane
      - stream-edge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
