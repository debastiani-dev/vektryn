name: Deploy - GCP Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/contracts/**"
      - "services/**"
      - "frontend/**"
      - "infra/terraform/**"
      - ".github/workflows/deploy-gcp.yml"

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'vektryn' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push container images
        run: |
          REGISTRY="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}"
          TAG="${{ github.sha }}"

          docker build -f services/control-plane/Dockerfile -t "$REGISTRY/control-plane:$TAG" -t "$REGISTRY/control-plane:latest" .
          docker build -f services/stream-edge/Dockerfile -t "$REGISTRY/stream-edge:$TAG" -t "$REGISTRY/stream-edge:latest" .
          docker build -f frontend/Dockerfile -t "$REGISTRY/frontend:$TAG" -t "$REGISTRY/frontend:latest" frontend

          docker push --all-tags "$REGISTRY/control-plane"
          docker push --all-tags "$REGISTRY/stream-edge"
          docker push --all-tags "$REGISTRY/frontend"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          REGISTRY="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}"
          TAG="${{ github.sha }}"
          STATE_BUCKET="${{ vars.TF_STATE_BUCKET }}"

          if [ -n "$STATE_BUCKET" ]; then
            terraform init -backend-config="bucket=$STATE_BUCKET"
          else
            terraform init -backend=false
          fi

          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="control_plane_image=$REGISTRY/control-plane:$TAG" \
            -var="stream_edge_image=$REGISTRY/stream-edge:$TAG" \
            -var="frontend_image=$REGISTRY/frontend:$TAG"

      - name: Run Django database migrations
        run: |
          gcloud run jobs execute vektryn-migrate \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --wait

      - name: Smoke check Control Plane health
        run: |
          CP_URL=$(gcloud run services describe vektryn-control-plane \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")
          curl --fail --silent --show-error "${CP_URL}/api/v1/health/"


      - name: Run Django database migrations
        run: |
          gcloud run jobs execute vektryn-migrate \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --wait

      - name: Smoke check Control Plane health
        run: |
          CP_URL=$(gcloud run services describe vektryn-control-plane \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.url)")
          curl --fail --silent --show-error "${CP_URL}/api/v1/health/"