name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Format check with Black
        run: poetry run black --check .

      - name: Run pytest
        run: poetry run pytest

  control-plane:
    name: Control Plane (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vektryn_test
          POSTGRES_USER: vektryn
          POSTGRES_PASSWORD: vektryn_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vektryn -d vektryn_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vektryn_test
      POSTGRES_USER: vektryn
      POSTGRES_PASSWORD: vektryn_test_password
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Format check with Black
        run: poetry run black --check .

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=vektryn_test_password psql -h localhost -U vektryn -d vektryn_test -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run Django system checks
        run: poetry run python manage.py check

      - name: Run pytest
        run: poetry run pytest

  stream-edge:
    name: Stream Edge (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stream-edge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install "poetry>=2.0,<3.0"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Format check with Black
        run: poetry run black --check .

      - name: Run pytest
        run: poetry run pytest

  frontend:
    name: Frontend (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with Oxlint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b

      - name: Run Vitest
        run: npm test

      - name: Production build
        run: npm run build
