global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: stream-edge
    metrics_path: /metrics
    static_configs:
      - targets: ["stream-edge:8001"]

  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:8000"]

  - job_name: enrichment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["enrichment-worker:9101"]

  - job_name: matcher-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["matcher-worker:9102"]

  - job_name: enrichment-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["enrichment-worker:9101"]

  - job_name: matcher-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["matcher-worker:9102"]
